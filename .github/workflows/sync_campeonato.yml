name: Actualizar campeonato

on:
  # Ejecución manual desde GitHub
  workflow_dispatch:

  # Respaldo automático:
  # Todos los domingos a las 15:00 hora de Lima (20:00 UTC)
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  actualizar:
    name: Resultados + goleadores + tarjetas
    runs-on: ubuntu-latest

    env:
      GOOGLE_CLOUD_PROJECT: futbol-ccl

      # Resultados
      GOOGLE_SHEET_ID: 1W_2_TOEyyh8LBJe6MA9NCK_ivx89dEjFO_8NUyvwMO4
      GOOGLE_SHEET_RANGE: "Resultados!A:F"
      FIXTURE_PATH: CurrentTournament/fixture.csv
      FIRESTORE_COLLECTION: partidos_clausura_2026

      # Goleadores
      GOLEADORES_SHEET_ID: 15fdBty1qflPukp4uDg6ncS9WXphhcvkKTvqXiPLbPFM
      GOLEADORES_SHEET_NAME: Goleadores
      FIRESTORE_RESULTS_COLLECTION: partidos_clausura_2026
      FIRESTORE_SCORERS_COLLECTION: goleadores_clausura_2026

      # Tarjetas
      TARJETAS_SHEET_ID: 1HYWjmjt2zqaTdJ11j9nmjwHS-NH2sgmU3agxlnQkWXk
      TARJETAS_SHEET_NAME: Tarjetas
      FIRESTORE_CARDS_COLLECTION: tarjetas_clausura_2026

      # Credencial Firebase / Firestore
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias
        run: pip install -r pipeline/requirements.txt

      - name: Preparar credencial de Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ.get(
              "FIREBASE_SERVICE_ACCOUNT_JSON",
              "",
          )

          if not value.strip():
              raise SystemExit(
                  "Falta el secret "
                  "FIREBASE_SERVICE_ACCOUNT_JSON."
              )

          parsed = json.loads(value)

          if parsed.get("project_id") != "futbol-ccl":
              raise SystemExit(
                  "El secret no pertenece "
                  "al proyecto futbol-ccl."
              )

          Path(
              "/tmp/firebase-service-account.json"
          ).write_text(
              value,
              encoding="utf-8",
          )
          PY

      - name: Validar sintaxis
        run: |
          python -m py_compile \
            pipeline/pipeline_service.py \
            pipeline/pipeline_goleadores.py \
            pipeline/pipeline_tarjetas.py \
            pipeline/sync_campeonato.py

      - name: Actualizar campeonato
        run: python -m pipeline.sync_campeonato

      - name: Notificar Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="✅ Cambridge League actualizado correctamente"
          else
            MESSAGE="❌ Error actualizando Cambridge League"
          fi

          MESSAGE="${MESSAGE}

          📝 Resultados + goleadores + tarjetas
          🔄 Origen: ${EVENT_NAME}
          🏆 Workflow: Actualizar campeonato"

          curl -s \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}"

      - name: Eliminar credencial temporal
        if: always()
        run: rm -f /tmp/firebase-service-account.json